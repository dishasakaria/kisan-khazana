<html><head><meta charset="utf-8"><title>Sell Smart pitch</title>

<style>

<script>
const $ = id => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, p) => a + (b - a) * p;
const seg = (t, a, b) => cl((t - a) / (b - a));
const eio = p => p < .5 ? 2 * p * p : 1 - (-2 * p + 2) ** 2 / 2, eout = p => 1 - (1 - p) ** 3;
const back = p => p <= 0 ? 0 : p >= 1 ? 1 : 1 + 2.7 * (p - 1) ** 3 + 1.7 * (p - 1) ** 2;
const R = (th, L) => [-L * Math.sin(th * Math.PI / 180), L * Math.cos(th * Math.PI / 180)];
const attr = (el, k, v) => el.setAttribute(k, v);
let S = [], D = [], CL = [], SUBS = [], ANIM = [], BUB = [];

/* ---------------- world: background ---------------- */
function house(x, y, s, wall, roof) {
  return `<g transform="translate(${x},${y}) scale(${s})"><rect x="-40" y="-46" width="80" height="46" fill="${wall}"/>
  <path d="M-50,-44 L0,-80 L50,-44Z" fill="${roof}"/><rect x="-8" y="-28" width="16" height="28" fill="#6d4c41"/>
  <rect x="-30" y="-34" width="12" height="12" fill="#5d7f99"/><rect x="18" y="-34" width="12" height="12" fill="#5d7f99"/></g>`;
}
function tree(x, y, s, c = "#4f8f3a") {
  return `<g transform="translate(${x},${y}) scale(${s})"><path d="M-8,0 L-5,-90 L5,-90 L8,0Z" fill="#6d4c41"/>
  <circle cx="0" cy="-120" r="55" fill="${c}"/><circle cx="-45" cy="-95" r="38" fill="${c}"/><circle cx="45" cy="-98" r="40" fill="${c}"/>

}
function sack(x, y, s = 1, rot = 0) {
  return `<g transform="translate(${x},${y}) rotate(${rot}) scale(${s})">

  <path d="M10,-116 l2,-10" stroke="#7cb342" stroke-width="3"/><circle cx="6" cy="-106" r="4" fill="#fff" opacity=".35"/></g>`;
}
function truck(id, big = 1) {   // side view facing right, origin = ground under rear of bed
  return `<g id="${id}"><g transform="scale(${big})">
  <rect x="0" y="-205" width="300" height="140" rx="8" fill="#2e7d32"/><rect x="0" y="-205" width="300" height="18" fill="#ffca28"/>

  ${[60, 200, 380].map(x => `<circle cx="${x}" cy="-40" r="40" fill="#263238"/><circle cx="${x}" cy="-40" r="16" fill="#90a4ae"/>`).join("")}
  </g></g>`;
}
function fields() {
  const VP = [960, 300], ys = [548, 572, 610, 672, 770, 860], cols = ["#7cb342", "#9ccc65", "#c5e1a5", "#d7c98f", "#689f38", "#aed581", "#8bc34a"];
  let o = "", k = 0;
  const X = (xb, y) => VP[0] + (xb - VP[0]) * (y - VP[1]) / (1080 - VP[1]);
  for (let r = 0; r < ys.length - 1; r++) for (let xb = -4200; xb < 6000; xb += 900) {
    const a = ys[r], b = ys[r + 1], off = (r % 2) * 420, x0 = xb + off, x1 = x0 + 900, c = cols[(k++ * 5 + r) % cols.length];
    o += `<path d="M${X(x0, a)},${a} L${X(x1, a)},${a} L${X(x1, b)},${b} L${X(x0, b)},${b}Z" fill="${c}" stroke="#6f9a3e" stroke-width="2" stroke-opacity=".35"/>`;
    if ((k + r) % 3) for (let q = 1; q < 6; q++) { const xr = x0 + q * 150; o += `<path d="M${X(xr, a)},${a} L${X(xr, b)},${b}" stroke="#4e7d2c" stroke-width="${1 + r * .6}" opacity=".35"/>`; }
  }
  return o;
}
function background() {
  return `<defs>
   <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fb8ea"/><stop offset=".7" stop-color="#bfe6f7"/><stop offset="1" stop-color="#fdf3d6"/></linearGradient>
   <linearGradient id="duskg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3a78"/><stop offset=".45" stop-color="#d9637a"/><stop offset=".8" stop-color="#fca65a"/><stop offset="1" stop-color="#ffd59a"/></linearGradient>

  </defs>
  <rect x="-1200" y="-600" width="4400" height="1200" fill="url(#sky)"/>
  <rect id="dusk" x="-1200" y="-600" width="4400" height="1200" fill="url(#duskg)" opacity="0"/>
  <g id="sun"><circle r="190" fill="url(#glow)"/><circle id="sunc" r="68" fill="#fff4b8"/></g>
  <g id="clouds" fill="#fff" opacity=".9">${[[200, 150, 1], [900, 110, .8], [1500, 210, .7], [2300, 140, 1], [-300, 220, .8]].map(([x, y, s]) =>
    `<g transform="translate(${x},${y}) scale(${s})"><ellipse rx="110" ry="34"/><ellipse cx="-40" cy="-22" rx="55" ry="38"/><ellipse cx="35" cy="-30" rx="62" ry="44"/></g>`).join("")}</g>
  <path d="M-1200,560 L-1200,470 L-700,470 L-620,428 L-300,428 L-220,478 L120,478 L190,436 L600,436 L690,498 L880,498 L960,452 L1360,452 L1430,490 L1720,490 L1790,442 L2200,442 L2290,500 L3200,500 L3200,560Z" fill="#a3bfb6"/>
  <path d="M-1200,570 Q-900,505 -500,540 Q-100,515 300,535 Q700,505 1100,540 Q1500,512 1900,536 Q2400,508 3200,540 L3200,600 L-1200,600Z" fill="#86b46e"/>
  <rect x="-1200" y="546" width="4400" height="900" fill="#9ccc65"/>

  ${house(300, 552, .55, "#f3e0c0", "#c0583a")}${house(380, 556, .5, "#efe3cf", "#a84c34")}${house(1320, 552, .6, "#f6e7cb", "#c0583a")}${house(1420, 556, .5, "#eadcc4", "#b4523a")}
  ${house(1530, 552, .58, "#f3e0c0", "#c0583a")}${house(2350, 552, .55, "#efe3cf", "#a84c34")}
  <g transform="translate(1610,552) scale(.6)"><path d="M-30,0 L-30,-60 L0,-120 L30,-60 L30,0Z" fill="#f5e6c8"/><path d="M0,-120 L0,-160" stroke="#6d4c41" stroke-width="3"/><path d="M0,-160 L26,-150 L0,-140Z" fill="#ff8f00"/></g>
  ${tree(220, 560, .5, "#5e9c45")}${tree(1250, 560, .45)}${tree(1720, 562, .55, "#5e9c45")}${tree(2500, 560, .5)}
  <path d="M960,548 Q900,620 1020,700 Q1160,790 980,880 L1240,1100 L1500,1100 Q1320,900 1240,790 Q1100,680 990,548Z" fill="#dcc08f" opacity=".9"/>
  <path d="M-1200,800 Q200,760 900,790 Q1700,770 3200,800 L3200,1400 L-1200,1400Z" fill="#d8b98a"/>
  <path d="M-1200,800 Q200,760 900,790 Q1700,770 3200,800 L3200,815 Q1700,785 900,805 Q200,775 -1200,815Z" fill="#c4a274"/>
  ${tree(120, 880, 1.6, "#4a8a35")}
  ${sack(520, 880, 1.15, -4)}${sack(625, 884, 1.15, 3)}${sack(570, 790, 1.1, -2)}${sack(680, 800, 1.0, 5)}${sack(450, 892, 1.05, -6)}
  <g id="seat" transform="translate(760,884) scale(1.75,1.08)">${sack(0, 0, 1)}</g>
  ${truck("truck")}
  <rect id="warm" x="-1200" y="380" width="4400" height="1400" fill="#ff7043" opacity="0"/>
  <rect id="bgdim" x="-1200" y="-600" width="4400" height="2200" fill="#0c2416" opacity="0"/>`;
}

/* ---------------- world: characters ---------------- */
const RAMU = { skin: "#b97a50", skinD: "#9c6340", kurta: "#f4f0e4", kurtaD: "#ddd6c2", vest: "#7b5a43", pants: "#f8f5ec", hair: "#2f2a27", ramu: 1 };
const SHAMU = { skin: "#c98d60", skinD: "#a8714a", kurta: "#2a9d8f", kurtaD: "#21867a", pants: "#f1eee4", hair: "#1c1c1c" };
function charSVG(id, c) {
  const arm = side => { const k = side < 0 ? "L" : "R"; return `
   <g id="${id}-ua${k}"><rect x="-16" y="-8" width="32" height="100" rx="16" fill="${c.kurta}"/>
    <g id="${id}-fa${k}"><rect x="-14" y="-6" width="28" height="56" rx="14" fill="${c.kurta}"/><rect x="-11" y="36" width="22" height="42" rx="11" fill="${c.skin}"/>
     <circle cx="0" cy="84" r="16" fill="${c.skin}"/></g></g>`; };
  const leg = side => `<g id="${id}-lg${side < 0 ? "L" : "R"}">
    <rect x="${side < 0 ? -46 : 4}" y="372" width="42" height="${c.ramu ? 180 : 215}" rx="18" fill="${c.pants}"/>
    ${c.ramu ? `<rect x="${side < 0 ? -38 : 12}" y="540" width="26" height="48" rx="10" fill="${c.skin}"/><path d="M${side < 0 ? -40 : 10},400 l6,140" stroke="#e2dccb" stroke-width="3"/>` : ""}
    <ellipse cx="${side * 27}" cy="592" rx="28" ry="10" fill="#4e342e"/></g>`;
  const torso = c.ramu
    ? `<path d="M-60,205 C-72,260 -78,380 -82,478 L82,478 C78,380 72,260 60,205 Q0,186 -60,205Z" fill="${c.kurta}"/>
       <path d="M-60,206 C-70,270 -72,340 -70,410 L-14,410 L-8,214 Q-30,200 -60,206Z" fill="${c.vest}"/>
       <path d="M60,206 C70,270 72,340 70,410 L14,410 L8,214 Q30,200 60,206Z" fill="${c.vest}"/>
       <circle cx="-24" cy="300" r="4" fill="#d7c09a"/><circle cx="-24" cy="340" r="4" fill="#d7c09a"/>`
    : `<path d="M-60,205 C-72,260 -80,390 -84,500 L84,500 C80,390 72,260 60,205 Q0,186 -60,205Z" fill="${c.kurta}"/>
       <path d="M40,210 C56,280 62,400 64,500 L84,500 C80,390 72,260 60,205Z" fill="${c.kurtaD}"/>
       <path d="M0,198 L0,300" stroke="${c.kurtaD}" stroke-width="4"/><circle cx="6" cy="232" r="3.5" fill="#e0f2f1"/><circle cx="6" cy="262" r="3.5" fill="#e0f2f1"/>
       <path d="M-22,196 Q0,214 22,196" stroke="${c.kurtaD}" stroke-width="5" fill="none"/>`;
  const hair = c.ramu
    ? `<path d="M-55,104 Q-60,84 -52,74 L-46,100Z M55,104 Q60,84 52,74 L46,100Z" fill="#5a524c"/>
       <path d="M-62,80 L62,80 L55,48 Q0,18 -55,48Z" fill="#ffffff"/><path d="M-60,73 L60,73" stroke="#e3e3e3" stroke-width="3"/>
       <path d="M-48,54 Q0,36 48,54" stroke="#e6e6e6" stroke-width="3" fill="none"/>`
    : `<path d="M-57,104 Q-62,40 -10,36 Q42,28 60,72 Q62,92 56,106 Q50,74 20,66 Q-22,62 -44,80 Q-53,90 -57,104Z" fill="${c.hair}"/>`;
  const stache = c.ramu
    ? `<path d="M-28,146 Q-14,134 0,141 Q14,134 28,146 Q24,152 14,150 Q6,147 0,148 Q-6,147 -14,150 Q-24,152 -28,146Z" fill="#2d2420"/><path d="M-20,143 Q-12,139 -6,141" stroke="#7d7470" stroke-width="2"/>`
    : `<path d="M-18,144 Q0,137 18,144 Q0,142 -18,144Z" fill="#1c1c1c" opacity=".85"/>`;
  return `<g id="${id}"><ellipse cx="0" cy="598" rx="${c.ramu ? 92 : 86}" ry="14" fill="#000" opacity=".16"/>
   <g id="${id}-legs">${leg(-1)}${leg(1)}</g>
   <g id="${id}-up">${torso}<rect x="-15" y="160" width="30" height="46" fill="${c.skinD}"/>
    <g id="${id}-head">
     <ellipse cx="-54" cy="120" rx="10" ry="16" fill="${c.skinD}"/><ellipse cx="54" cy="120" rx="10" ry="16" fill="${c.skinD}"/>
     <ellipse cx="0" cy="112" rx="54" ry="64" fill="${c.skin}"/>${hair}
     ${c.ramu ? `<path d="M-24,128 Q-32,144 -28,160 M24,128 Q32,144 28,160" stroke="${c.skinD}" stroke-width="2.5" fill="none" opacity=".6"/>` : ""}
     <circle id="${id}-blushL" cx="-34" cy="140" r="11" fill="#e57373" opacity="0"/><circle id="${id}-blushR" cx="34" cy="140" r="11" fill="#e57373" opacity="0"/>
     <g id="${id}-eyes"><ellipse cx="-20" cy="113" rx="6.5" ry="7.5" fill="#2b1d16"/><ellipse cx="20" cy="113" rx="6.5" ry="7.5" fill="#2b1d16"/>
      <circle cx="-18" cy="110" r="2" fill="#fff"/><circle cx="22" cy="110" r="2" fill="#fff"/></g>

     <path id="${id}-mouth" fill="#7a2e2e" stroke="#7a2e2e" stroke-width="3.5" stroke-linejoin="round"/>${stache}

const PHONE = `<g transform="translate(0,-26)"><rect x="-20" y="-36" width="40" height="70" rx="7" fill="#212121"/><rect x="-16" y="-29" width="32" height="52" rx="3" fill="#6fb6e8"/>
  <circle cx="0" cy="-4" r="9" fill="#fff"/><path d="M-5,-4 L5,-8 L2,1Z" fill="#29a9eb"/></g>`;
const NOTE = `<g transform="translate(14,-20) rotate(-8)"><rect x="-42" y="-30" width="84" height="60" rx="4" fill="#fff8e1" stroke="#c9b27c" stroke-width="2"/>
  <path d="M-32,-14 h50 M-32,0 h40 M-32,14 h56" stroke="#90a4ae" stroke-width="2"/><path d="M10,-20 l14,14 M24,-20 l-14,14" stroke="#e53935" stroke-width="3"/>
  <text x="-8" y="10" font-size="16" fill="#e53935" font-weight="800">₹?</text></g>`;
const SACK1 = sack(0, 0, .8);

function pose(id, p, t) {
  const g = n => $(id + n);
  const sitDy = p.sit * 82, bob = p.bob || 0;
  attr($(id), "transform", `translate(${p.x},${p.y}) rotate(${p.lean || 0}) scale(${p.s}) translate(0,-600)`);
  attr(g("-legs"), "transform", `translate(0,600) scale(1,${1 - .4 * p.sit}) translate(0,-600)`);

/* ---------------- per-frame ---------------- */
function camAt(i, lt) {
  const p = lt / D[i];
  return [
    () => [lerp(960, 800, eio(p)), lerp(540, 650, eio(p)), lerp(1, 1.3, eio(p))],
    () => [lerp(800, 780, p), lerp(650, 640, p), lerp(1.3, 1.34, p)],
    () => [960, 640, 1.18],
    () => [1000, 600, 1.2],
    () => [1560, 524, .9], () => [1560, 524, .9], () => [1560, 524, .9],
    () => [lerp(1250, 1270, p), 640, lerp(1, 1.04, p)],
  ][i]();
}
function seek(t) {
  let i = 0; while (i < 7 && t >= S[i + 1]) i++;

  // ---- background state

  $("dusk").setAttribute("opacity", sunset); $("warm").setAttribute("opacity", .16 * sunset);
  attr($("sun"), "transform", `translate(${lerp(1500, 1700, sunset)},${lerp(170, 470, sunset)}) scale(${1 + .5 * sunset})`);
  $("sunc").setAttribute("fill", sunset > .5 ? "#ffb74d" : "#fff4b8");
  attr($("clouds"), "transform", `translate(${t * 6},0)`);
  $("bgdim").setAttribute("opacity", (i === 4 || i === 5) ? .55 * eout(seg(lt, 0, .8)) : i === 6 ? .55 : 0);
  // truck drives in at sunset
  const tx = i === 7 ? lerp(2700, 1470, eout(seg(lt, .2, 2.4))) : 4000;
  attr($("truck"), "transform", `translate(${tx},880)`);

  // ---- characters
  const R0 = { x: 760, y: 880, s: .72, sit: 0, lg: [0, 0], ua: [8, -8], fa: [0, 0], head: 0, mood: 0 };
  const r = { ...R0 }, sh = { ...R0, x: 2600 };
  const rtalk = talk("ramu", t), stalk = talk("shamu", t);
  if (i <= 1) {
    r.sit = 1; r.ua = [12, -12]; r.fa = [-20, 20]; r.head = -3 + Math.sin(t * 1.3) * 2; r.mood = i ? -.9 : -.35 - .3 * seg(lt, 3, 6);
    if (i === 1) {
      const nb = eout(seg(lt, 0, .6)); r.ua[0] = lerp(12, 15, nb); r.fa[0] = lerp(-20, -144, nb); r.prop = NOTE; r.propSide = "L";
      const sc = eio(seg(lt, 1.4, 2.2)) * (1 - eio(seg(lt, D[1] - 2.2, D[1] - 1.4)));
      r.ua[1] = lerp(-12, -150, sc); r.fa[1] = lerp(20, -75 + 10 * Math.sin(lt * 16), sc); r.head = -7 * sc - 2;
    }
  } else if (i === 2) {
    r.sit = 1 - eio(seg(lt, 1.2, 2.0)); r.mood = lerp(-.7, .1, seg(lt, 2.4, 3.4)); r.head = lerp(-3, 5, seg(lt, 1, 2));
    r.ua = [12, -12]; r.fa = [-20, 20];
  } else if (i === 3) { r.mood = lerp(.2, .7, seg(lt, ck(3, 2) - S[3], ck(3, 2) - S[3] + .6)); r.head = 5;
  } else if (i === 4 || i === 5) {
    r.x = lerp(760, 820, eio(seg(lt, .3, 1.3))); r.lean = i === 5 ? 7 * eio(seg(lt, .2, 1.2)) : 0;
    r.mood = i === 4 ? lerp(.2, .9, seg(t, ck(4, 2) + .3, ck(4, 2) + 1)) : lerp(.3, 1, seg(t, ck(5, 2), ck(5, 2) + .6));
    r.head = 6 + (i === 5 ? 3 * Math.sin(seg(t, ck(5, 2), ck(5, 2) + 1.2) * Math.PI * 2) : 0);
    if (i === 4 && lt < 1.3 && lt > .3) walk(r, t, .7);
  } else if (i >= 6) {
    r.x = 1110; r.mood = 1; r.head = 4;
    const cheer = eio(seg(t, CL[7].start, CL[7].start + .5)) * (1 - eio(seg(t, CL[7].start + CL[7].dur, CL[7].start + CL[7].dur + .5)));
    r.ua = [lerp(10, 155, cheer), lerp(-10, -155, cheer)]; r.fa = [lerp(-30, 15 + 10 * Math.sin(t * 8), cheer), lerp(30, -15 - 10 * Math.sin(t * 8), cheer)];
  }
  r.open = rtalk;
  // Shamu
  if (i === 2) {
    const wk = seg(lt, 0, 2.4); sh.x = lerp(2150, 1110, eout(wk));
    if (wk < 1) walk(sh, t, 1 - wk * .6);
    const wave = seg(lt, .2, .6) * (1 - seg(lt, 3.2, 3.7));
    sh.ua = [lerp(8, 135, wave), -8]; sh.fa = [lerp(0, 45 + 22 * Math.sin(t * 11), wave), 0];

  }
  sh.open = stalk;
  pose("ramu", r, t); pose("shamu", sh, t);
  $("seat").style.opacity = 1;

  // ---- thought bubbles (scene 2)

  bt.forEach((b, k) => { const p = back(seg(t, b, b + .5)), o = i === 1 ? 1 : i === 2 ? 1 - seg(lt, .3, .9) : 0, b2 = BUB[k];
    attr($("bub" + k), "transform", `translate(${b2[0]},${b2[1]}) scale(${Math.max(.01, p)})`); $("bub" + k).style.opacity = o * cl(p * 3); });

  // ---- channel icons (scene 4)

    const s0 = S[3] + .9 + k * .55, p = eout(seg(t, s0, s0 + .9)), g = $("ic" + k), x = +g.dataset.x, y = +g.dataset.y;
    const vis = i === 3 ? 1 : 0;
    attr(g, "transform", `translate(${lerp(ph[0], x, p)},${lerp(ph[1], y, p)}) scale(${.3 + .7 * back(seg(t, s0, s0 + .9))})`);

  [0, 1, 2].forEach(k => { const s0 = ck(3, 1) + k * .45, g = $("lang" + k); g.style.opacity = i === 3 ? eout(seg(t, s0, s0 + .4)) : 0;
    attr(g, "transform", `translate(${1560 + (1 - eout(seg(t, s0, s0 + .4))) * 40},${465 + k * 82})`); });
  $("nosp").style.opacity = i === 3 ? eout(seg(t, ck(3, 2), ck(3, 2) + .4)) : 0;

  // ---- panels (scenes 5-6)

  const m1 = ck(6, 1), mg = eio(seg(t, m1 + .2, m1 + 1.8)), go = eio(seg(t, m1 + 1.9, m1 + 3.2));

  const sv = back(seg(t, m1 + 2.4, m1 + 2.9)); attr($("save"), "transform", `translate(280,92) scale(${Math.max(.01, sv)})`); $("save").style.opacity = sv > 0 ? 1 : 0;
  $("m2t").style.opacity = seg(t, m1 + 2.6, m1 + 3);
  const o2 = ck(6, 2) + 1.4, p3 = ck(6, 3);

    const p = eio(seg(t, o2 + k * .22, o2 + k * .22 + 1.0)); if (p >= 1) return "";

  }

  // ---- end card

  // ---- phone/montage HTML timeline + finger taps

  const f = $("finger"); f.style.display = "none";

  // ---- subtitles
  const sb = SUBS.find(s => t >= s.t0 - .05 && t < s.t1), el2 = $("subs");
  if (sb) {

    el2.style.opacity = 1;
  } else el2.style.opacity = 0;
