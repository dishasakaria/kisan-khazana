  adv:`<span class="best">✅ Lasalgaon market, Nashik</span><br>📏 18 km · 📅 Today, 2 Oct<br><span class="muted">₹4,300 × 50 qtl = ₹2,15,000<br>− Truck rent (₹25/km) ₹450<br>− Loading (hamali) ₹1,000</span><br><span class="cash" id="cash">💰 In hand: ₹2,13,550</span><br>₹16,000 more than the nearest market<br>🎯 Confidence: Medium`,

};
const $ = id => document.getElementById(id);
let S, starts, total, taps = [], typing = [];
function el(html, parent, tin, tout = 1e9, layout = true) {
  const t = document.createElement("template"); t.innerHTML = html.trim();
  const e = t.content.firstChild; e.dataset.in = tin; e.dataset.out = tout; if (layout) e.dataset.layout = 1;
  parent.appendChild(e); return e;
}
function setup(lang, D) {
  S = L[lang]; starts = []; let a = 0; for (const d of D) { starts.push(a); a += d; } total = a;
  const at = (i, x) => starts[i] + (x < 0 ? D[i] + x : x);   // x<0: seconds before the step ends
  const m = $("msgs"), k = $("kbs"); $("stepw").textContent = S.step; $("field").dataset.ph = S.msg;
  // step 1: search, open, START
  typing.push({e: $("q"), text: "@SellSmartKisanBot", a: at(0, .4), b: at(0, 2.4)});
  $("res").dataset.in = at(0, 2.5); $("res").dataset.layout = 1;
  const openT = at(0, 4.0); taps.push({e: $("res"), t: openT - .35});
  $("search").dataset.in = 0; $("search").dataset.out = openT; $("search").dataset.nofade = 1;
  el(`<div class="b desc">${S.desc}</div>`, m, openT, at(0, -1.2));
  const startT = at(0, -1.6); taps.push({e: $("startbtn"), t: startT});
  $("startbar").dataset.in = 0; $("startbar").dataset.out = startT + .3; $("startbar").dataset.layout = 1; $("startbar").dataset.nofade = 1;
  $("inp").dataset.in = startT + .3; $("inp").dataset.layout = 1; $("inp").dataset.nofade = 1;
  el(`<div class="b me">/start</div>`, m, startT + .3);
  // step 2: name
  const hello = el(`<div class="b">${S.hello}<div class="ibtns c3">${["मराठी","हिंदी","English"].map(b => `<div>${b}</div>`).join("")}</div></div>`, m, at(1, .3));
  taps.push({e: hello.querySelectorAll(".ibtns div")[S.pick], t: at(1, 2.2), keep: 1});
  const sendT = at(1, -1.4);
  typing.push({e: $("field"), text: S.name, a: at(1, -3.2), b: sendT - .5, clear: sendT});
  taps.push({e: $("send"), t: sendT});
  el(`<div class="b me">${S.name}</div>`, m, sendT + .3);
  // steps 3-5: bot question + reply keyboard + tap
  const ask = (i, q, btns, cls, pick, reply) => {
    el(`<div class="b">${q}</div>`, m, at(i, .3));
    const tapT = at(i, -1.6);
    const kb = el(`<div class="kb ${cls}">${btns.map(b => `<div>${b}</div>`).join("")}</div>`, k, at(i, .5), tapT + .35);
    taps.push({e: kb.children[pick], t: tapT});
    el(reply, m, tapT + .4);
  };
  ask(2, S.thanks, [S.locBtn], "c1", 0, `<div class="b me loc"><div class="map"><span>📍</span></div><p>${S.loc}</p></div>`);
  ask(3, S.crop, S.crops, "c3", 0, `<div class="b me">${S.crops[0]}</div>`);
  ask(4, S.qty, ["10","20","50","100","200",S.write], "c3", 2, `<div class="b me">50</div>`);
  // step 6: advice card
  el(`<div class="b adv"><div class="map sm"><span>📍</span><i>${S.mandi}</i></div>${S.adv}<div class="ibtns">${S.ib.map(b => `<div>${b}</div>`).join("")}</div></div>`, m, at(5, .4));
  window.cashT = at(5, 2.0);
  // step 7: tips, then end card
  $("tips").dataset.in = at(6, .3); $("tips").dataset.out = starts[7] + .4;
  S.tips.forEach((tx, j) => { const sp = tx.indexOf(" ");
    el(`<div class="tip"><span class="e">${tx.slice(0, sp)}</span>${tx.slice(sp + 1)}</div>`, $("tips"), at(6, .5 + j * 2.2)); });
  $("end").innerHTML = `<div class="logo">🌾</div><h1>${S.end}</h1><div class="s">${S.endS}</div><div class="h">@SellSmartKisanBot</div>`;
  $("end").dataset.in = starts[7];
  return total;
}
function seek(t) {
  const i = Math.max(0, starts.filter(s => s <= t).length - 1);
  const si = Math.min(i, 6); $("n").textContent = si + 1; $("capt").textContent = S.caps[si];
  const pop = Math.min(1, (t - starts[si]) / .3); $("num").style.transform = `scale(${.7 + .3 * pop})`;
  $("bar").style.width = (100 * t / total) + "%";
  for (const e of document.querySelectorAll("[data-in]")) {
    const vis = t >= +e.dataset.in && t < +(e.dataset.out || 1e9);
    e.style.display = vis ? "" : "none";
    if (vis && !e.dataset.nofade) { const p = Math.min(1, (t - e.dataset.in) / .35);
      e.style.opacity = p; e.style.transform = e.dataset.layout ? `translateY(${(1 - p) * 24}px)` : ""; }
  }
  for (const y of typing) {
    const n = Math.round(Math.max(0, Math.min(1, (t - y.a) / (y.b - y.a))) * y.text.length);
    const txt = (y.clear && t >= y.clear) ? "" : [...y.text].slice(0, n).join("");
    y.e.textContent = txt || y.e.dataset.ph || ""; y.e.classList.toggle("t", !!txt);
  }
  const cash = $("cash"); if (cash) { const p = t - window.cashT;
    cash.style.background = p > 0 ? `rgba(255,202,40,${Math.min(1, p / .4) * (.55 + .35 * Math.sin(p * 4))})` : ""; }
  const f = $("finger"), r = $("ring"); f.style.display = r.style.display = "none";
  for (const tp of taps) {
    tp.e.classList.toggle("pressed", t >= tp.t && (tp.keep || t < tp.t + .35));
    if (t < tp.t - .9 || t > tp.t + .5) continue;
    const b = tp.e.getBoundingClientRect(), cx = b.left + b.width / 2, cy = b.top + b.height / 2;
    const k = Math.min(1, (t - (tp.t - .9)) / .7), ease = 1 - (1 - k) ** 3;
    f.style.display = "";
    f.style.left = (cx - 22 + (1 - ease) * 140) + "px"; f.style.top = (cy - 6 + (1 - ease) * 220) + "px";
    f.style.transform = `scale(${t >= tp.t && t < tp.t + .2 ? .85 : 1})`;
    if (t >= tp.t - .1) { const q = Math.min(1, (t - tp.t + .1) / .5), R = 30 + q * 50;
      r.style.display = ""; r.style.opacity = 1 - q; r.style.width = r.style.height = 2 * R + "px";
      r.style.left = cx - R + "px"; r.style.top = cy - R + "px"; }
  }
}

const qs = new URLSearchParams(location.search);
if (qs.get("lang")) { const T = setup(qs.get("lang"), [9,7,7,7,6,10,8,5]); const t0 = performance.now();
